name: Full Audit

on:
  push:
    branches:
      - audit/full-code-review
  workflow_dispatch:

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: true
      - name: Unit tests
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build application
        shell: cmd
        run: scripts\windows\build-app.cmd
      - name: Build installer and uninstaller
        shell: cmd
        run: scripts\windows\build-installer.cmd
