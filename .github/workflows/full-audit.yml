name: Full Audit

on:
  push:
    branches:
      - audit/full-code-review
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          # Keep the shipping compatibility build under the same toolchain as
          # production until the Windows 7 vs current-Go decision is made.
          go-version: '1.20.x'
          cache: true
      - name: Application unit tests
        run: go test -count=1 ./cmd/linkvideo-monitor
      - name: Application race tests
        continue-on-error: true
        run: go test -race -count=1 ./cmd/linkvideo-monitor
      - name: Application vet
        continue-on-error: true
        run: go vet ./cmd/linkvideo-monitor
      - name: Create compile-only installer payload
        shell: pwsh
        run: python -c "import zipfile; zipfile.ZipFile(r'installer/payload.zip','w').close()"
      - name: Installer unit tests
        working-directory: installer
        run: go test -count=1 ./...
      - name: Installer vet
        continue-on-error: true
        working-directory: installer
        run: go vet ./...
      - name: Remove compile-only payload
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue installer/payload.zip
      - name: Build application
        shell: cmd
        run: scripts\windows\build-app.cmd
      - name: Build installer and uninstaller
        shell: cmd
        run: scripts\windows\build-installer.cmd

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          # Audit source with a currently supported/patched standard library so
          # findings are about our code. The shipping Go 1.20 risk is tracked
          # separately as a release-blocking platform decision.
          go-version: '1.25.13'
          cache: false
      - name: Check gofmt
        continue-on-error: true
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          bad="$(gofmt -l $files)"
          if [ -n "$bad" ]; then
            echo "Files requiring gofmt:"
            echo "$bad"
            exit 1
          fi
      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Staticcheck application for Windows
        continue-on-error: true
        env:
          GOOS: windows
          GOARCH: amd64
        run: staticcheck ./cmd/linkvideo-monitor
      - name: Govulncheck application for Windows
        continue-on-error: true
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck ./cmd/linkvideo-monitor
      - name: Create compile-only installer payload
        run: python3 -c "import zipfile; zipfile.ZipFile('installer/payload.zip','w').close()"
      - name: Staticcheck installer for Windows
        continue-on-error: true
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: staticcheck ./...
      - name: Govulncheck installer for Windows
        continue-on-error: true
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck ./...
      - name: Remove compile-only payload
        run: rm -f installer/payload.zip
      - name: Python syntax check
        continue-on-error: true
        run: python3 -m py_compile tools/*.py
