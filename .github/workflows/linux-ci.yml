name: Linux CI

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/linkvideo-monitor/**'
      - 'scripts/linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/linux-ci.yml'
      - 'go.mod'
      - 'go.work'
  pull_request:
    paths:
      - 'cmd/linkvideo-monitor/**'
      - 'scripts/linux/**'
      - 'packaging/linux/**'
      - '.github/workflows/linux-ci.yml'
      - 'go.mod'
      - 'go.work'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Test common Monitor package on Linux
        run: go test ./cmd/linkvideo-monitor
      - name: Vet common Monitor package on Linux
        run: go vet ./cmd/linkvideo-monitor
      - name: Build Linux development binary
        run: |
          mkdir -p build/linux
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags='-s -w -X main.platformBuildVersion=0.1.0-dev' \
            -o build/linux/LinkVideo.Monitor ./cmd/linkvideo-monitor
      - name: Verify Linux binary
        run: |
          file build/linux/LinkVideo.Monitor
          test -x build/linux/LinkVideo.Monitor
