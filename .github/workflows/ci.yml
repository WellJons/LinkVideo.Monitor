name: CI

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Test
        run: go test ./cmd/linkvideo-monitor
      - name: Build application
        shell: cmd
        run: scripts\windows\build-app.cmd
