name: CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  apply-reviewed-fixes:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'audit/full-code-review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-code-review
          fetch-depth: 0
      - name: Apply reviewed fixes
        run: python3 tools/apply_audit_round3.py
      - name: Format Go sources
        run: gofmt -w $(git ls-files '*.go')
      - name: Remove temporary audit machinery
        run: |
          rm -f tools/apply_audit_round3.py
          rm -f .github/workflows/apply-audit-round3.yml
          rm -f .audit-round3-trigger
      - name: Commit reviewed fixes
        run: |
          git config user.name "WellJons"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix installer rollback and Windows service startup"
          git push origin HEAD:audit/full-code-review

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Test
        run: go test ./cmd/linkvideo-monitor
      - name: Build application
        shell: cmd
        run: scripts\windows\build-app.cmd
      - name: Build installer and uninstaller
        shell: cmd
        run: scripts\windows\build-installer.cmd
