name: Apply adaptive optimization once

on:
  push:
    branches: [feature/adaptive-low-end-optimization]
    paths: [.github/workflows/apply-adaptive-once.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/adaptive-low-end-optimization
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Apply 0.8.12 adaptive runtime changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              if old not in s:
                  raise SystemExit(f'pattern not found in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8')

          replace_once('cmd/linkvideo-monitor/main.go', 'appVersion = "0.8.11-beta"', 'appVersion = "0.8.12-beta"')
          replace_once('installer/main.go', 'version     = "0.8.11"', 'version     = "0.8.12"')
          p = Path('scripts/windows/build-installer.cmd')
          s = p.read_text(encoding='utf-8')
          if '0.8.11' not in s:
              raise SystemExit('0.8.11 installer version was not found')
          p.write_text(s.replace('0.8.11', '0.8.12'), encoding='utf-8')

          replace_once(
              'cmd/linkvideo-monitor/main.go',
              '\t\tencoder := a.selectVideoEncoder(cfg, plan)\n\t\ta.mu.Lock()\n',
              '\t\tencoder := a.selectVideoEncoder(cfg, plan)\n\t\truntimeCfg, runtimeOptimized := a.runtimeConfigForPerformance(cfg, plan, encoder)\n\t\ta.mu.Lock()\n',
          )
          p = Path('cmd/linkvideo-monitor/main.go')
          s = p.read_text(encoding='utf-8')
          start = s.index('func (a *app) runLoop(gen int64)')
          end = s.index('\nfunc (a *app) scanPipe', start)
          chunk = s[start:end]
          changes = [
              ('if cfg.AudioEnabled && cfg.AudioSource == "system" {', 'if runtimeCfg.AudioEnabled && runtimeCfg.AudioSource == "system" {'),
              ('if cfg.MicrophoneEnabled {', 'if runtimeCfg.MicrophoneEnabled {'),
              ('startMicrophoneBridge(streamCtx, a, cfg)', 'startMicrophoneBridge(streamCtx, a, runtimeCfg)'),
              ('buildEncoderFFmpegDetailed(cfg, plan, encoder, audioURL, microphoneURL)', 'buildEncoderFFmpegDetailed(runtimeCfg, plan, encoder, audioURL, microphoneURL)'),
              ('exec.Command(resolveExecutable(cfg.FFmpegPath), args...)', 'exec.Command(resolveExecutable(runtimeCfg.FFmpegPath), args...)'),
              ('if cfg.OutputMode != "local" {', 'if runtimeCfg.OutputMode != "local" {'),
              ('resolveExecutable(cfg.FFmpegPath)}, shownArgs', 'resolveExecutable(runtimeCfg.FFmpegPath)}, shownArgs'),
              ('\t\tlowerProcessPriority(cmd.Process.Pid)\n', '\t\tif !runtimeOptimized {\n\t\t\tlowerProcessPriority(cmd.Process.Pid)\n\t\t}\n'),
              ('capture := newCaptureSupervisor(a, cfg, plan)', 'capture := newCaptureSupervisor(a, runtimeCfg, plan, runtimeOptimized)'),
              ('reason = "Соединение с сервером было прервано"', 'reason = "RTSP-соединение было прервано"'),
          ]
          for old, new in changes:
              if old not in chunk:
                  raise SystemExit(f'runLoop pattern missing: {old!r}')
              chunk = chunk.replace(old, new, 1)
          s = s[:start] + chunk + s[end:]
          old = 'func buildEncoderFFmpegDetailed(cfg Config, plan capturePlan, encoder, systemAudioURL, microphoneAudioURL string) (string, []string, capturePlan, error) {\n\tnormalizeConfig(&cfg)\n'
          new = '''func buildEncoderFFmpegDetailed(cfg Config, plan capturePlan, encoder, systemAudioURL, microphoneAudioURL string) (string, []string, capturePlan, error) {
          \truntimeFPS := cfg.FPS
          \tnormalizeConfig(&cfg)
          \t// 10/12 FPS are internal emergency modes selected only by the adaptive
          \t// performance controller. Keep normalizeConfig strict for persisted/UI
          \t// settings, but allow those two runtime-only values in the encoder pipeline.
          \tif runtimeFPS == 10 || runtimeFPS == 12 {
          \t\tcfg.FPS = runtimeFPS
          \t}
          '''
          if old not in s:
              raise SystemExit('encoder runtime normalization pattern missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('cmd/linkvideo-monitor/capture_pipeline.go')
          s = p.read_text(encoding='utf-8')
          s = s.replace('\tprotectedFrame []byte\n}', '\tprotectedFrame []byte\n\tnormalPriority bool\n}', 1)
          s = s.replace('func newCaptureSupervisor(a *app, cfg Config, plan capturePlan) *captureSupervisor {', 'func newCaptureSupervisor(a *app, cfg Config, plan capturePlan, normalPriority bool) *captureSupervisor {', 1)
          s = s.replace('\t\tprotectedFrame: makeProtectedDesktopFrame(plan.OutputWidth, plan.OutputHeight),\n\t}', '\t\tprotectedFrame: makeProtectedDesktopFrame(plan.OutputWidth, plan.OutputHeight),\n\t\tnormalPriority: normalPriority,\n\t}', 1)
          if '\tlowerProcessPriority(cmd.Process.Pid)\n' not in s:
              raise SystemExit('capture priority call missing')
          s = s.replace('\tlowerProcessPriority(cmd.Process.Pid)\n', '\tif !s.normalPriority {\n\t\tlowerProcessPriority(cmd.Process.Pid)\n\t}\n', 1)
          p.write_text(s, encoding='utf-8')

          replace_once('cmd/linkvideo-monitor/logs.go', 'a.markPendingRestart("Сервер закрыл RTSP-соединение", false)', 'a.markPendingRestart("RTSP-соединение разорвано (Broken pipe)", false)')

          p = Path('cmd/linkvideo-monitor/webui.go')
          s = p.read_text(encoding='utf-8')
          old = "async function checkUpdates(){const b=document.getElementById('checkUpdatesButton');try{b.disabled=true;b.textContent='Проверка…';const x=await api('/api/check-updates',{method:'POST'});if(x.available){notify('Доступна версия '+x.latest_version);if(x.download_url&&confirm('Доступна версия '+x.latest_version+'. Открыть страницу загрузки?'))window.open(x.download_url,'_blank','noopener')}else notify('Установлена последняя версия')}catch(e){notify(e.message,'error')}finally{b.disabled=false;b.textContent='Проверить обновления'}}"
          new = "async function checkUpdates(){const b=document.getElementById('checkUpdatesButton');try{b.disabled=true;b.textContent='Проверка…';const x=await api('/api/check-updates',{method:'POST'});if(x.available){notify('Доступна версия '+x.latest_version+'. Она будет установлена автоматически в фоновом режиме.')}else notify('Установлена последняя версия')}catch(e){notify(e.message,'error')}finally{b.disabled=false;b.textContent='Проверить обновления'}}"
          if old not in s:
              raise SystemExit('checkUpdates function does not match expected code')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('cmd/linkvideo-monitor/adaptive_performance.go').write_text(r'''package main

          import (
          	"context"
          	"fmt"
          	"os/exec"
          	"strings"
          	"time"
          )

          const adaptivePerformanceHeadroom = 1.10

          type runtimePerformanceCandidate struct {
          	FPS    int
          	Preset string
          }

          func softwarePresetRank(name string) int {
          	switch strings.ToLower(strings.TrimSpace(name)) {
          	case "placebo": return 0
          	case "veryslow": return 1
          	case "slower": return 2
          	case "slow": return 3
          	case "medium": return 4
          	case "fast": return 5
          	case "faster": return 6
          	case "veryfast": return 7
          	case "superfast": return 8
          	case "ultrafast": return 9
          	default: return 7
          	}
          }

          func runtimePerformanceCandidates(cfg Config, encoder string) []runtimePerformanceCandidate {
          	if encoder != "libx264" && encoder != "libx265" { return nil }
          	fps := cfg.FPS
          	if fps < 1 { fps = 15 }
          	preset := strings.ToLower(strings.TrimSpace(cfg.Preset))
          	if preset == "" { preset = "veryfast" }
          	result := make([]runtimePerformanceCandidate, 0, 7)
          	add := func(candidate runtimePerformanceCandidate) {
          		if candidate.FPS < 1 || candidate.Preset == "" { return }
          		for _, existing := range result { if existing == candidate { return } }
          		result = append(result, candidate)
          	}
          	add(runtimePerformanceCandidate{FPS: fps, Preset: preset})
          	currentRank := softwarePresetRank(preset)
          	for _, faster := range []string{"veryfast", "superfast", "ultrafast"} { if softwarePresetRank(faster) > currentRank { add(runtimePerformanceCandidate{FPS: fps, Preset: faster}) } }
          	if fps > 15 { add(runtimePerformanceCandidate{FPS: 15, Preset: "ultrafast"}) }
          	if fps > 12 { add(runtimePerformanceCandidate{FPS: 12, Preset: "ultrafast"}) }
          	if fps > 10 { add(runtimePerformanceCandidate{FPS: 10, Preset: "ultrafast"}) }
          	return result
          }

          func benchmarkRuntimePerformance(cfg Config, plan capturePlan, encoder string, candidate runtimePerformanceCandidate) (float64, error) {
          	width, height := even(plan.OutputWidth), even(plan.OutputHeight)
          	if width < 128 || height < 72 { width, height = 128, 72 }
          	fps := candidate.FPS
          	if fps < 1 { return 0, fmt.Errorf("некорректная частота кадров %d", fps) }
          	frames := fps * 2
          	if frames < 20 { frames = 20 }
          	mediaDuration := time.Duration(float64(frames) / float64(fps) * float64(time.Second))
          	const timeout = 12 * time.Second
          	ctx, cancel := context.WithTimeout(context.Background(), timeout); defer cancel()
          	args := []string{"-hide_banner","-loglevel","error","-f","lavfi","-i",fmt.Sprintf("testsrc2=s=%dx%d:r=%d",width,height,fps),"-frames:v",fmt.Sprint(frames),"-vf","format=yuv420p","-c:v",encoder,"-preset",candidate.Preset,"-tune","zerolatency","-b:v",fmt.Sprintf("%dk",cfg.BitrateKbps),"-maxrate",fmt.Sprintf("%dk",cfg.MaxrateKbps),"-bufsize",fmt.Sprintf("%dk",cfg.BufsizeKbps),"-g",fmt.Sprint(fps*2),"-keyint_min",fmt.Sprint(fps*2),"-sc_threshold","0","-bf","0","-f","null","-"}
          	cmd := exec.CommandContext(ctx, resolveExecutable(cfg.FFmpegPath), args...); hideChildWindow(cmd)
          	started := time.Now(); output, err := cmd.CombinedOutput(); elapsed := time.Since(started)
          	if ctx.Err() != nil { return 0, fmt.Errorf("тест производительности превысил %d секунд", int(timeout/time.Second)) }
          	if err != nil { text := strings.TrimSpace(string(output)); if len(text)>320{text=text[:320]}; if text==""{text=err.Error()}; return 0, fmt.Errorf("%s",text) }
          	if elapsed <= 0 { return 0,nil }
          	actualFPS := float64(frames)/elapsed.Seconds(); maxElapsed := time.Duration(float64(mediaDuration)/adaptivePerformanceHeadroom)
          	if elapsed > maxElapsed { return actualFPS, fmt.Errorf("%.1f кадр/с при требуемых %d кадр/с",actualFPS,fps) }
          	return actualFPS,nil
          }

          func (a *app) runtimeConfigForPerformance(cfg Config, plan capturePlan, encoder string) (Config, bool) {
          	candidates := runtimePerformanceCandidates(cfg, encoder); if len(candidates)==0{return cfg,false}
          	var lastFPS float64; var lastErr error
          	for index,candidate := range candidates {
          		actualFPS,err := benchmarkRuntimePerformance(cfg,plan,encoder,candidate); lastFPS,lastErr=actualFPS,err; if err!=nil{continue}
          		runtimeCfg:=cfg; runtimeCfg.FPS=candidate.FPS; runtimeCfg.Preset=candidate.Preset
          		optimized:=runtimeCfg.FPS!=cfg.FPS || !strings.EqualFold(runtimeCfg.Preset,cfg.Preset)
          		if optimized { a.appendLog(fmt.Sprintf("Автооптимизация слабого ПК: %s, %d FPS (тест %.1f кадр/с). Сохранённые настройки не изменены",candidate.Preset,candidate.FPS,actualFPS)) } else if index==0 { a.appendLog(fmt.Sprintf("Проверка производительности: текущий режим выдерживает нагрузку (тест %.1f кадр/с)",actualFPS)) }
          		return runtimeCfg,optimized
          	}
          	fallback:=candidates[len(candidates)-1]; runtimeCfg:=cfg; runtimeCfg.FPS=fallback.FPS; runtimeCfg.Preset=fallback.Preset
          	if lastErr!=nil { a.appendLog(fmt.Sprintf("Автооптимизация слабого ПК: включён минимальный режим %s, %d FPS; последний тест: %.1f кадр/с (%v)",fallback.Preset,fallback.FPS,lastFPS,lastErr)) }
          	return runtimeCfg, runtimeCfg.FPS!=cfg.FPS || !strings.EqualFold(runtimeCfg.Preset,cfg.Preset)
          }
          ''', encoding='utf-8')

          Path('cmd/linkvideo-monitor/adaptive_performance_test.go').write_text(r'''package main
          import "testing"
          func TestRuntimePerformanceCandidatesDoNotChangeUIConfig(t *testing.T){cfg:=defaultConfig();cfg.FPS=15;cfg.Preset="veryfast";items:=runtimePerformanceCandidates(cfg,"libx264");want:=[]runtimePerformanceCandidate{{15,"veryfast"},{15,"superfast"},{15,"ultrafast"},{12,"ultrafast"},{10,"ultrafast"}};if len(items)!=len(want){t.Fatalf("candidate count=%d want=%d: %#v",len(items),len(want),items)};for i:=range want{if items[i]!=want[i]{t.Fatalf("candidate[%d]=%#v want=%#v",i,items[i],want[i])}};if cfg.FPS!=15||cfg.Preset!="veryfast"{t.Fatalf("candidate generation mutated user config: %+v",cfg)}}
          func TestRuntimePerformanceCandidatesPreserveFasterPreset(t *testing.T){cfg:=defaultConfig();cfg.FPS=30;cfg.Preset="ultrafast";items:=runtimePerformanceCandidates(cfg,"libx264");want:=[]runtimePerformanceCandidate{{30,"ultrafast"},{15,"ultrafast"},{12,"ultrafast"},{10,"ultrafast"}};if len(items)!=len(want){t.Fatalf("candidate count=%d want=%d: %#v",len(items),len(want),items)};for i:=range want{if items[i]!=want[i]{t.Fatalf("candidate[%d]=%#v want=%#v",i,items[i],want[i])}}}
          func TestRuntimePerformanceCandidatesSkipHardware(t *testing.T){if items:=runtimePerformanceCandidates(defaultConfig(),"h264_qsv");len(items)!=0{t.Fatalf("hardware encoder should not use CPU fallback ladder: %#v",items)}}
          func TestHiddenFallbackFPSKeepsTwoSecondGOP(t *testing.T){cfg:=defaultConfig();cfg.OutputMode="local";cfg.FPS=12;cfg.Preset="ultrafast";plan:=capturePlan{Mode:"monitor",Width:1280,Height:720,OutputWidth:1280,OutputHeight:720};_,args,_,err:=buildEncoderFFmpegDetailed(cfg,plan,"libx264","","");if err!=nil{t.Fatal(err)};for i:=0;i+1<len(args);i++{if args[i]=="-g"{if args[i+1]!="24"{t.Fatalf("GOP=%s want=24 for 12 FPS",args[i+1])};return}};t.Fatal("-g was not generated")}
          ''', encoding='utf-8')

          Path('cmd/linkvideo-monitor/update_security.go').write_text(r'''package main
          import("encoding/hex";"errors";"net/url";"strings")
          const publicUpdateDownloadPrefix="/WellJons/LinkVideo.Monitor.Updates/releases/download/"
          func validateAutomaticUpdateDownload(downloadURL,sha256sum string)error{u,err:=url.Parse(strings.TrimSpace(downloadURL));if err!=nil||u.Scheme!="https"||!strings.EqualFold(u.Hostname(),"github.com"){return errors.New("автоматическое обновление разрешено только через GitHub LinkVideo.Monitor.Updates")};if !strings.HasPrefix(u.EscapedPath(),publicUpdateDownloadPrefix){return errors.New("ссылка обновления не относится к официальному каналу LinkVideo.Monitor.Updates")};if u.RawQuery!=""||u.Fragment!=""{return errors.New("ссылка обновления содержит недопустимые параметры")};digest,err:=hex.DecodeString(strings.TrimSpace(sha256sum));if err!=nil||len(digest)!=32{return errors.New("для автоматического обновления требуется корректная SHA-256 сумма")};return nil}
          ''',encoding='utf-8')
          Path('cmd/linkvideo-monitor/update_security_test.go').write_text(r'''package main
          import "testing"
          func TestValidateAutomaticUpdateDownload(t *testing.T){good:="https://github.com/WellJons/LinkVideo.Monitor.Updates/releases/download/v0.8.13-beta/LinkVideo.Monitor_0.8.13_Setup.exe";sha:="0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef";if err:=validateAutomaticUpdateDownload(good,sha);err!=nil{t.Fatalf("official update URL rejected: %v",err)};bad:=[]string{"http://github.com/WellJons/LinkVideo.Monitor.Updates/releases/download/x/a.exe","https://example.com/WellJons/LinkVideo.Monitor.Updates/releases/download/x/a.exe","https://github.com/WellJons/Other/releases/download/x/a.exe"};for _,raw:=range bad{if validateAutomaticUpdateDownload(raw,sha)==nil{t.Fatalf("unsafe URL accepted: %s",raw)}};if validateAutomaticUpdateDownload(good,"bad")==nil{t.Fatal("invalid SHA-256 was accepted")}}
          ''',encoding='utf-8')

          Path('cmd/linkvideo-monitor/service_auto_update_windows.go').write_text(r'''//go:build windows
          package main
          import("context";"crypto/sha256";"encoding/hex";"errors";"fmt";"io";"net/http";"net/url";"os";"os/exec";"path/filepath";"strings";"time")
          const(autoUpdateInitialDelay=90*time.Second;autoUpdateInterval=6*time.Hour;autoUpdateMaxBytes=int64(256<<20))
          func init(){if len(os.Args)>1&&os.Args[1]=="--uac-service"{go runServiceAutomaticUpdates()}}
          func runServiceAutomaticUpdates(){timer:=time.NewTimer(autoUpdateInitialDelay);defer timer.Stop();for{select{case<-serviceStopCh:return;case<-timer.C:launched,err:=checkDownloadAndLaunchAutomaticUpdate();if err!=nil{serviceLog("automatic update: "+err.Error())};if launched{serviceLog("automatic update installer started; stopping service for upgrade");serviceStopOnce.Do(func(){close(serviceStopCh)});return};timer.Reset(autoUpdateInterval)}}}
          func checkDownloadAndLaunchAutomaticUpdate()(bool,error){ctx,cancel:=context.WithTimeout(context.Background(),20*time.Second);result,err:=checkForUpdates(ctx);cancel();if err!=nil{return false,err};if !result.Available{cleanupStaleUpdateInstallers();return false,nil};if err:=validateAutomaticUpdateDownload(result.DownloadURL,result.SHA256);err!=nil{return false,err};installerPath,err:=downloadVerifiedUpdateInstaller(result);if err!=nil{return false,err};cmd:=exec.Command(installerPath,"--silent-update-elevated");hideChildWindow(cmd);if err:=cmd.Start();err!=nil{return false,fmt.Errorf("не удалось запустить установщик %s: %w",result.LatestVersion,err)};serviceLog(fmt.Sprintf("automatic update: %s -> %s verified and launched",appVersion,result.LatestVersion));return true,nil}
          func automaticUpdateDirectory()(string,error){appPath,err:=loadInstalledAppPath();if err!=nil{return "",err};programFiles:=filepath.Dir(filepath.Dir(appPath));dir:=filepath.Join(programFiles,"LinkVideoUpdaterCache");if err:=os.MkdirAll(dir,0o700);err!=nil{return "",err};return dir,nil}
          func downloadVerifiedUpdateInstaller(result updateCheckResult)(string,error){u,err:=url.Parse(result.DownloadURL);if err!=nil{return "",err};name:=filepath.Base(u.Path);if decoded,decodeErr:=url.PathUnescape(name);decodeErr==nil{name=decoded};lower:=strings.ToLower(name);if !strings.HasPrefix(lower,"linkvideo.monitor_")||!strings.HasSuffix(lower,"_setup.exe")||strings.ContainsAny(name,`\\/:*?"<>|`){return "",errors.New("сервер обновлений вернул недопустимое имя установщика")};dir,err:=automaticUpdateDirectory();if err!=nil{return "",fmt.Errorf("не удалось подготовить папку обновлений: %w",err)};cleanupStaleUpdateInstallers();finalPath:=filepath.Join(dir,name);tmpPath:=finalPath+".download";_=os.Remove(tmpPath);_=os.Remove(finalPath);ctx,cancel:=context.WithTimeout(context.Background(),10*time.Minute);defer cancel();req,err:=http.NewRequestWithContext(ctx,http.MethodGet,result.DownloadURL,nil);if err!=nil{return "",err};req.Header.Set("User-Agent","LinkVideo-Monitor-Updater/"+appVersion);client:=&http.Client{Timeout:10*time.Minute};resp,err:=client.Do(req);if err!=nil{return "",fmt.Errorf("не удалось скачать обновление: %w",err)};defer resp.Body.Close();if resp.StatusCode!=http.StatusOK{return "",fmt.Errorf("сервер установщика вернул HTTP %d",resp.StatusCode)};if resp.ContentLength>autoUpdateMaxBytes{return "",errors.New("установщик обновления превышает допустимый размер")};f,err:=os.OpenFile(tmpPath,os.O_CREATE|os.O_TRUNC|os.O_WRONLY,0o600);if err!=nil{return "",err};h:=sha256.New();limited:=io.LimitReader(resp.Body,autoUpdateMaxBytes+1);n,copyErr:=io.Copy(io.MultiWriter(f,h),limited);syncErr:=f.Sync();closeErr:=f.Close();if copyErr!=nil{_=os.Remove(tmpPath);return "",copyErr};if syncErr!=nil{_=os.Remove(tmpPath);return "",syncErr};if closeErr!=nil{_=os.Remove(tmpPath);return "",closeErr};if n>autoUpdateMaxBytes{_=os.Remove(tmpPath);return "",errors.New("установщик обновления превышает допустимый размер")};actual:=hex.EncodeToString(h.Sum(nil));if !strings.EqualFold(actual,strings.TrimSpace(result.SHA256)){_=os.Remove(tmpPath);return "",errors.New("SHA-256 установщика не совпадает с манифестом; обновление отменено")};if err:=os.Rename(tmpPath,finalPath);err!=nil{_=os.Remove(tmpPath);return "",err};return finalPath,nil}
          func cleanupStaleUpdateInstallers(){dir,err:=automaticUpdateDirectory();if err!=nil{return};entries,err:=os.ReadDir(dir);if err!=nil{return};cutoff:=time.Now().Add(-48*time.Hour);for _,entry:=range entries{if entry.IsDir(){continue};name:=strings.ToLower(entry.Name());if !strings.HasSuffix(name,".exe")&&!strings.HasSuffix(name,".download"){continue};info,statErr:=entry.Info();if statErr==nil&&info.ModTime().Before(cutoff){_=os.Remove(filepath.Join(dir,entry.Name()))}}}
          ''',encoding='utf-8')

          Path('installer/silent_update_windows.go').write_text(r'''//go:build windows && !uninstaller
          package main
          import("fmt";"os";"path/filepath";"time")
          func init(){if len(os.Args)<2||os.Args[1]!="--silent-update-elevated"{return};if !isProcessElevated(){appendSilentUpdateLog("silent update rejected: installer is not elevated");os.Exit(21)};time.Sleep(1500*time.Millisecond);if err:=installProductSilentSystem();err!=nil{appendSilentUpdateLog("silent update failed: "+err.Error());os.Exit(22)};appendSilentUpdateLog("silent update completed: "+version);os.Exit(0)}
          func installProductSilentSystem()error{dest:=defaultInstallDir();legacyLocalDest:=filepath.Join(os.Getenv("LOCALAPPDATA"),"Programs","LinkVideo.Monitor");oldDest:=filepath.Join(os.Getenv("LOCALAPPDATA"),"Programs","LinkVideo.ScreenSender");legacyProgramFiles:=filepath.Join(os.Getenv("ProgramFiles"),"LinkVideo.Monitor");legacyProgramFilesX86:=filepath.Join(os.Getenv("ProgramFiles(x86)"),"LinkVideo.Monitor");appPath:=filepath.Join(dest,"LinkVideo.Monitor.exe");stopCaptureServiceForUpgrade();stopInstalledProcesses(dest,legacyLocalDest,oldDest,legacyProgramFiles,legacyProgramFilesX86);if err:=os.MkdirAll(dest,0o755);err!=nil{return fmt.Errorf("не удалось создать папку установки: %w",err)};if err:=extractPayload(dest,nil);err!=nil{return err};_=os.Remove(filepath.Join(dest,"LinkVideo.ScreenOverlay.exe"));_=os.Remove(filepath.Join(dest,"LinkVideo.AudioLoopback.exe"));if _,err:=os.Stat(appPath);err!=nil{return fmt.Errorf("основной файл программы не найден после обновления: %w",err)};if err:=registerUninstall(appPath,dest);err!=nil{return fmt.Errorf("не удалось обновить регистрацию программы: %w",err)};if err:=installUACServiceElevated(appPath);err!=nil{return fmt.Errorf("не удалось обновить фоновую службу: %w",err)};return nil}
          func appendSilentUpdateLog(message string){base:=os.Getenv("PROGRAMDATA");if base==""{base=os.TempDir()};dir:=filepath.Join(base,"LinkVideo.Monitor");_=os.MkdirAll(dir,0o755);path:=filepath.Join(dir,"update-install.log");f,err:=os.OpenFile(path,os.O_CREATE|os.O_APPEND|os.O_WRONLY,0o600);if err!=nil{return};defer f.Close();_,_=fmt.Fprintf(f,"%s %s\r\n",time.Now().Format("2006-01-02 15:04:05"),message)}
          ''',encoding='utf-8')
          PY

          gofmt -w cmd/linkvideo-monitor/main.go cmd/linkvideo-monitor/capture_pipeline.go cmd/linkvideo-monitor/logs.go cmd/linkvideo-monitor/adaptive_performance.go cmd/linkvideo-monitor/adaptive_performance_test.go cmd/linkvideo-monitor/update_security.go cmd/linkvideo-monitor/update_security_test.go cmd/linkvideo-monitor/service_auto_update_windows.go installer/main.go installer/silent_update_windows.go

      - name: Test and compile
        shell: bash
        run: |
          set -e
          go test ./cmd/linkvideo-monitor
          go test -race ./cmd/linkvideo-monitor
          go vet ./cmd/linkvideo-monitor
          GOOS=windows GOARCH=amd64 GOAMD64=v1 go build -trimpath -ldflags='-s -w -H=windowsgui' -o /tmp/LinkVideo.Monitor.exe ./cmd/linkvideo-monitor
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('installer/payload.zip','w') as z:
              z.writestr('compile-check.txt','ok')
          PY
          (cd installer && GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/LinkVideo.Monitor_Setup.exe .)
          rm -f installer/payload.zip

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "LinkVideo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-adaptive-once.yml
          git add -A
          git commit -m "Prepare 0.8.12 adaptive low-end optimization"
