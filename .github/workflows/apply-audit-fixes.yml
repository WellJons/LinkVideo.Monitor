name: Apply Audit Fixes

on:
  push:
    branches:
      - audit/full-code-review

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-code-review
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Apply exact reviewed replacements
        run: python3 tools/apply_full_audit_fixes.py
      - name: Format Go files
        run: gofmt -w $(git ls-files '*.go')
      - name: Remove one-shot patch machinery
        run: |
          rm tools/apply_full_audit_fixes.py
          rm .github/workflows/apply-audit-fixes.yml
      - name: Commit fixes
        run: |
          git config user.name "LinkVideo Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Apply full audit security and reliability fixes [audit-fix-applied]"
          git push origin HEAD:audit/full-code-review
