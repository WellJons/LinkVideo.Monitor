name: Apply safe stream resilience once

on:
  push:
    branches: [feature/safe-stream-resilience]
    paths: [.github/workflows/apply-safe-stream-resilience.yml]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/safe-stream-resilience
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
      - name: Apply bounded queues and normal streaming priority
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('cmd/linkvideo-monitor/main.go')
          s = p.read_text(encoding='utf-8')
          replacements = [
              ('"-thread_queue_size", "8",\n\t\t\t"-f", "s16le",', '"-thread_queue_size", "32",\n\t\t\t"-f", "s16le",'),
              ('"-thread_queue_size", "16",\n\t\t\t"-f", "s16le",', '"-thread_queue_size", "32",\n\t\t\t"-f", "s16le",'),
              ('"-thread_queue_size", "2",\n\t\t"-f", "rawvideo",', '"-thread_queue_size", "4",\n\t\t"-f", "rawvideo",'),
          ]
          for old, new in replacements:
              if old not in s:
                  raise SystemExit(f'main.go pattern not found: {old!r}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = Path('cmd/linkvideo-monitor/runtime_encoder_fallback.go')
          s = p.read_text(encoding='utf-8')
          old = '''func keepNormalStreamingPriority(encoder string, optimized bool) bool {
          \t// Software encoding needs fair access to all CPU cores. Hardware encoders can
          \t// stay below-normal in the normal case because most of their work is on GPU.
          \treturn optimized || !isHardwareEncoder(encoder)
          }
          '''
          new = '''func keepNormalStreamingPriority(encoder string, optimized bool) bool {
          \t// Keep the whole streaming pipeline at normal priority. Even when video is
          \t// encoded in hardware, this FFmpeg process still performs BGRA->NV12 colour
          \t// conversion, audio work, muxing and network I/O on the CPU. Demoting the
          \t// process can starve those threads on a busy/low-end PC and create avoidable
          \t// stalls before the encoder or RTSP socket.
          \t_ = encoder
          \t_ = optimized
          \treturn true
          }
          '''
          if old not in s:
              raise SystemExit('keepNormalStreamingPriority pattern not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          Path('cmd/linkvideo-monitor/safe_stream_resilience_test.go').write_text(r'''package main

          import "testing"

          func queueBeforeInput(args []string, input string) string {
          	for i := 0; i < len(args); i++ {
          		if args[i] != "-i" || i+1 >= len(args) || args[i+1] != input {
          			continue
          		}
          		for j := i - 1; j >= 1 && j >= i-12; j-- {
          			if args[j-1] == "-thread_queue_size" {
          				return args[j]
          			}
          		}
          	}
          	return ""
          }

          func TestEncoderUsesBoundedResilienceQueues(t *testing.T) {
          	cfg := defaultConfig()
          	cfg.OutputMode = "local"
          	cfg.AudioEnabled = true
          	cfg.AudioSource = "system"
          	cfg.MicrophoneEnabled = true
          	cfg.MicrophoneDevice = "test microphone"
          	plan := capturePlan{Mode: "monitor", Width: 1920, Height: 1080, OutputWidth: 1920, OutputHeight: 1080}
          	systemURL := "tcp://127.0.0.1:12345"
          	micURL := "tcp://127.0.0.1:12346"
          	_, args, _, err := buildEncoderFFmpegDetailed(cfg, plan, "libx264", systemURL, micURL)
          	if err != nil {
          		t.Fatal(err)
          	}
          	if got := queueBeforeInput(args, systemURL); got != "32" {
          		t.Fatalf("system audio queue=%q want 32", got)
          	}
          	if got := queueBeforeInput(args, micURL); got != "32" {
          		t.Fatalf("microphone queue=%q want 32", got)
          	}
          	if got := queueBeforeInput(args, "pipe:0"); got != "4" {
          		t.Fatalf("raw video queue=%q want 4", got)
          	}
          }

          func TestAllStreamingEncodersKeepNormalPriority(t *testing.T) {
          	for _, encoder := range []string{"libx264", "libx265", "h264_qsv", "hevc_qsv", "h264_nvenc", "hevc_nvenc", "h264_amf", "hevc_amf"} {
          		if !keepNormalStreamingPriority(encoder, false) {
          			t.Fatalf("%s unexpectedly eligible for below-normal streaming priority", encoder)
          		}
          	}
          }
          ''', encoding='utf-8')
          PY

          gofmt -w cmd/linkvideo-monitor/main.go cmd/linkvideo-monitor/runtime_encoder_fallback.go cmd/linkvideo-monitor/safe_stream_resilience_test.go

      - name: Verify
        shell: bash
        run: |
          set -e
          go test ./cmd/linkvideo-monitor
          go test -race ./cmd/linkvideo-monitor
          go vet ./cmd/linkvideo-monitor
          GOOS=windows GOARCH=amd64 GOAMD64=v1 go build -trimpath -ldflags='-s -w -H=windowsgui' -o /tmp/LinkVideo.Monitor.exe ./cmd/linkvideo-monitor

      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "LinkVideo Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-safe-stream-resilience.yml
          git add -A
          git commit -m "Improve stream resilience without changing capture path"
          git push origin HEAD:feature/safe-stream-resilience
