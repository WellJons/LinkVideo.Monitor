name: macOS CI

on:
  push:
    branches:
      - main
    paths:
      - 'cmd/linkvideo-monitor/**'
      - 'native/macos/**'
      - 'packaging/macos/**'
      - 'scripts/macos/**'
      - '.github/workflows/macos-ci.yml'
      - 'go.mod'
      - 'go.work'
  pull_request:
    paths:
      - 'cmd/linkvideo-monitor/**'
      - 'native/macos/**'
      - 'packaging/macos/**'
      - 'scripts/macos/**'
      - '.github/workflows/macos-ci.yml'
      - 'go.mod'
      - 'go.work'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.x'
          cache: false
      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          go version
      - name: Test existing Monitor package on macOS
        run: go test ./cmd/linkvideo-monitor
      - name: Check macOS packaging scripts
        run: |
          bash -n scripts/macos/build-app.sh
          bash -n scripts/macos/package-pkg.sh
          bash -n scripts/macos/package-dmg.sh
          bash -n 'packaging/macos/Uninstall LinkVideo Monitor.command'
          bash -n packaging/macos/pkg-scripts/preinstall
      - name: Build Universal macOS app
        run: scripts/macos/build-app.sh
      - name: Verify app bundle
        run: |
          set -euo pipefail
          APP='build/macos/LinkVideo.Monitor.app'
          test -x "$APP/Contents/MacOS/LinkVideo.Monitor"
          test -x "$APP/Contents/MacOS/ffmpeg.exe"
          test -x "$APP/Contents/MacOS/mediamtx"
          test -x "$APP/Contents/Resources/linkvideo-capture-helper"
          test -x "$APP/Contents/Resources/linkvideo-workspace-helper"
          test -x "$APP/Contents/Resources/linkvideo-overlay-helper"
          test -x "$APP/Contents/Resources/linkvideo-hotkey-helper"
          plutil -lint "$APP/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$APP/Contents/Info.plist")" = '13.0'
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = '0.1.0'
          lipo -archs "$APP/Contents/MacOS/LinkVideo.Monitor" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/LinkVideo.Monitor" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/linkvideo-capture-helper" | grep -q arm64
          lipo -archs "$APP/Contents/Resources/linkvideo-capture-helper" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/linkvideo-workspace-helper" | grep -q arm64
          lipo -archs "$APP/Contents/Resources/linkvideo-workspace-helper" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/linkvideo-overlay-helper" | grep -q arm64
          lipo -archs "$APP/Contents/Resources/linkvideo-overlay-helper" | grep -q x86_64
          lipo -archs "$APP/Contents/Resources/linkvideo-hotkey-helper" | grep -q arm64
          lipo -archs "$APP/Contents/Resources/linkvideo-hotkey-helper" | grep -q x86_64
          if "$APP/Contents/Resources/linkvideo-hotkey-helper" --toggle 'Ctrl+Alt+DefinitelyInvalid' --ptt ''; then
            echo 'Invalid hotkey was unexpectedly accepted' >&2
            exit 1
          fi
          startup_disable_status="$("$APP/Contents/MacOS/LinkVideo.Monitor" --set-startup false)"
          case "$startup_disable_status" in
            not-registered|not-found) ;;
            *) echo "Unexpected startup status after disable: $startup_disable_status" >&2; exit 1 ;;
          esac
          codesign --verify --deep --strict "$APP"
      - name: Package ZIP, PKG and DMG artifacts
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/macos/LinkVideo.Monitor.app \
            build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.zip
          bash scripts/macos/package-pkg.sh
          bash scripts/macos/package-dmg.sh
          test -f build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.pkg
          pkgutil --payload-files build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.pkg | grep -q 'Applications/LinkVideo.Monitor.app'
          pkgutil --payload-files build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.pkg | grep -q 'Applications/Uninstall LinkVideo Monitor.command'
      - uses: actions/upload-artifact@v4
        with:
          name: LinkVideo-Monitor-macOS-0.1.0-dev
          path: |
            build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.zip
            build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.pkg
            build/macos/LinkVideo.Monitor_macOS_0.1.0-dev.dmg
          if-no-files-found: error
