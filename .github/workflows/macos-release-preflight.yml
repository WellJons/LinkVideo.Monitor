name: macOS Release Preflight

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/macos/release-sign-notarize.sh'
      - 'scripts/macos/build-app.sh'
      - 'scripts/macos/build-bundled-app.sh'
      - 'scripts/macos/package-pkg.sh'
      - 'scripts/macos/package-dmg.sh'
      - 'docs/MACOS_RELEASE.md'
      - '.github/workflows/macos-production-release.yml'
      - '.github/workflows/macos-release-preflight.yml'
  pull_request:
    paths:
      - 'scripts/macos/release-sign-notarize.sh'
      - 'scripts/macos/build-app.sh'
      - 'scripts/macos/build-bundled-app.sh'
      - 'scripts/macos/package-pkg.sh'
      - 'scripts/macos/package-dmg.sh'
      - 'docs/MACOS_RELEASE.md'
      - '.github/workflows/macos-production-release.yml'
      - '.github/workflows/macos-release-preflight.yml'

permissions:
  contents: read

jobs:
  preflight:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          sw_vers
          xcodebuild -version
          xcrun notarytool --version
      - name: Validate production release script
        run: |
          bash -n scripts/macos/release-sign-notarize.sh
          bash scripts/macos/release-sign-notarize.sh --check
      - name: Validate production workflow structure and credential isolation
        run: |
          ruby - .github/workflows/macos-production-release.yml <<'RUBY'
          require 'yaml'
          path = ARGV.fetch(0)
          data = YAML.safe_load(File.read(path), aliases: true)
          abort 'top-level release workflow permissions must be contents: read' unless data.dig('permissions', 'contents') == 'read'
          build = data.dig('jobs', 'build') or abort 'missing build job'
          publish = data.dig('jobs', 'publish') or abort 'missing publish job'
          abort 'publish job must have contents: write' unless publish.dig('permissions', 'contents') == 'write'
          abort 'build job must not receive UPDATES_REPO_TOKEN' if build.to_s.include?('UPDATES_REPO_TOKEN')
          %w[MACOS_APP_CERT_P12_BASE64 MACOS_INSTALLER_CERT_P12_BASE64 MACOS_NOTARY_PASSWORD].each do |secret|
            abort "publish job must not receive #{secret}" if publish.to_s.include?(secret)
          end
          RUBY
          grep -q 'workflow_dispatch:' .github/workflows/macos-production-release.yml
          grep -q 'scripts/macos/release-sign-notarize.sh' .github/workflows/macos-production-release.yml
          grep -q 'update-manifest-macos.json' .github/workflows/macos-production-release.yml
          grep -q 'MACOS_APP_CERT_P12_BASE64' .github/workflows/macos-production-release.yml
          grep -q 'UPDATES_REPO_TOKEN' .github/workflows/macos-production-release.yml
      - name: Verify fail-closed credential handling
        run: |
          set -euo pipefail
          if MACOS_VERSION=0.1.0 \
             MACOS_APP_IDENTITY='' \
             MACOS_INSTALLER_IDENTITY='' \
             MACOS_NOTARY_PROFILE='' \
             MACOS_NOTARY_APPLE_ID='' \
             MACOS_NOTARY_TEAM_ID='' \
             MACOS_NOTARY_PASSWORD='' \
             bash scripts/macos/release-sign-notarize.sh >release-no-creds.log 2>&1; then
            echo 'Release script unexpectedly succeeded without signing credentials' >&2
            cat release-no-creds.log >&2
            exit 1
          fi
          grep -q 'MACOS_APP_IDENTITY is required' release-no-creds.log
