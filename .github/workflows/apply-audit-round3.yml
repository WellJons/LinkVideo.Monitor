name: Apply Audit Round 3
on:
  push:
    branches: [audit/full-code-review]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[audit-round3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/full-code-review
          fetch-depth: 0
      - name: Apply reviewed cleanup
        run: python3 tools/apply_audit_round3.py
      - name: Format
        run: gofmt -w $(git ls-files '*.go')
      - name: Remove one-shot machinery
        run: |
          rm tools/apply_audit_round3.py
          rm .github/workflows/apply-audit-round3.yml
          rm -f .audit-round3-trigger
      - name: Commit
        run: |
          git config user.name "LinkVideo Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete code and static-analysis noise [audit-round3-applied]"
          git push origin HEAD:audit/full-code-review
