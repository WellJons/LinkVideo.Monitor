name: Quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          # Go 1.20 is kept for Windows 7 compatibility.
          go-version: '1.20.x'
          cache: true

      - name: Test application
        run: go test -count=1 ./cmd/linkvideo-monitor

      - name: Race test application
        run: go test -race -count=1 ./cmd/linkvideo-monitor

      - name: Vet application
        run: go vet -unsafeptr=false ./cmd/linkvideo-monitor

      - name: Prepare installer tests
        shell: pwsh
        run: python -c "import zipfile; zipfile.ZipFile(r'installer/payload.zip','w').close()"

      - name: Test installer
        working-directory: installer
        run: go test -count=1 ./...

      - name: Vet installer
        working-directory: installer
        run: go vet -unsafeptr=false ./...

      - name: Remove temporary payload
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue installer/payload.zip

      - name: Build application
        shell: cmd
        run: scripts\windows\build-app.cmd

      - name: Build installer
        shell: cmd
        run: scripts\windows\build-installer.cmd

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: LinkVideo-Monitor-0.8.12-test
          if-no-files-found: error
          path: |
            build/LinkVideo.Monitor.exe
            build/LinkVideo.Monitor_0.8.12_Setup.exe
            build/Uninstall.exe

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          files="$(git ls-files '*.go')"
          bad="$(gofmt -l $files)"
          if [ -n "$bad" ]; then
            echo "Files requiring gofmt:"
            echo "$bad"
            exit 1
          fi

      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Staticcheck application
        env:
          GOOS: windows
          GOARCH: amd64
        run: staticcheck ./cmd/linkvideo-monitor

      - name: Vulnerability check application
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck ./cmd/linkvideo-monitor

      - name: Prepare installer checks
        run: python3 -c "import zipfile; zipfile.ZipFile('installer/payload.zip','w').close()"

      - name: Staticcheck installer
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: staticcheck ./...

      - name: Vulnerability check installer
        working-directory: installer
        env:
          GOOS: windows
          GOARCH: amd64
        run: govulncheck ./...

      - name: Remove temporary payload
        run: rm -f installer/payload.zip

      - name: Check Python tools
        run: python3 -m py_compile tools/*.py
