openapi: 3.0.3
info:
  title: LinkVideo Monitor Remote Sync API
  version: "2.0"
paths:
  /api/monitor/sync:
    post:
      summary: Получить состояние Monitor и вернуть управляемые настройки или команду
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRequest'
      responses:
        '200':
          description: Настройки и необязательная команда
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    SyncRequest:
      type: object
      required: [api_version, connection_link, client, state, settings, capabilities]
      properties:
        api_version: {type: integer, enum: [2]}
        connection_link: {type: string}
        client:
          type: object
          properties:
            product: {type: string}
            version: {type: string}
            computer_name: {type: string}
            os: {type: string}
            architecture: {type: string}
        state:
          type: object
          properties:
            process_running: {type: boolean}
            process_pid: {type: integer}
            stream_desired: {type: boolean}
            streaming: {type: boolean}
            ffmpeg_pid: {type: integer}
            started_at: {type: string, format: date-time}
            restarts: {type: integer}
            last_error: {type: string}
            session_locked: {type: boolean}
            capture_backend: {type: string}
            applied_revision: {type: integer, format: int64}
            last_command_id: {type: string}
        settings:
          $ref: '#/components/schemas/MonitorSettings'
        capabilities:
          type: object
          properties:
            protocols:
              type: array
              items: {type: string, enum: [rtsp, rtmp]}
            fps:
              type: array
              items: {type: integer, enum: [15, 25, 30]}
            bitrates_kbps:
              type: array
              items: {type: integer, enum: [256, 512, 1024]}
            resolution_profiles:
              type: array
              items: {type: string, enum: [original, full_hd, hd]}
            capture_modes:
              type: array
              items: {type: string, enum: [full, monitor]}
            microphone: {type: boolean}
            encoders:
              type: array
              items:
                type: object
                properties:
                  name: {type: string}
                  label: {type: string}
                  codec: {type: string, enum: [h264, h265]}
                  available: {type: boolean}
                  reason: {type: string}
    MonitorSettings:
      type: object
      properties:
        protocol: {type: string, enum: [rtsp, rtmp]}
        resolution_profile: {type: string, enum: [original, full_hd, hd]}
        capture_mode: {type: string, enum: [full, monitor]}
        monitor_number: {type: integer, minimum: 0}
        fps: {type: integer, enum: [15, 25, 30]}
        bitrate_kbps: {type: integer, enum: [256, 512, 1024]}
        codec: {type: string, enum: [h264, h265]}
        encoder: {type: string}
        cursor: {type: boolean}
        privacy_protection: {type: boolean}
        audio_enabled: {type: boolean}
        microphone_enabled: {type: boolean}
        microphone_device: {type: string}
        microphone_mode: {type: string, enum: [always, voice, push_to_talk]}
        microphone_voice_db: {type: integer, minimum: -70, maximum: -10}
        microphone_ptt_hotkey: {type: string}
        microphone_toggle_hotkey: {type: string}
        overlay_enabled: {type: boolean}
        launch_with_windows: {type: boolean}
        prevent_sleep: {type: boolean}
        keep_display_on: {type: boolean}
    SyncResponse:
      type: object
      properties:
        success: {type: boolean}
        message: {type: string}
        revision: {type: integer, format: int64}
        settings:
          $ref: '#/components/schemas/MonitorSettings'
        command:
          type: object
          required: [id, action]
          properties:
            id:
              oneOf:
                - {type: string}
                - {type: integer}
            action:
              type: string
              enum: [start_stream, stop_stream, restart_stream, restart_application]
